name: Monty first Krok connection check
on:
  push:
    branches: [main]
    paths: [.github/workflows/monty-krok-first-check.yml]
permissions:
  contents: read
jobs:
  connection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runner.txt
      - name: Test approved live provider connection
        env:
          KROK_API_KEY: ${{ secrets.KROK_API_KEY }}
        run: python check_krok.py --date 2026-11-17 --output connection_report.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: monty-first-connection-${{ github.run_id }}
          path: connection_report.json
          if-no-files-found: error
          retention-days: 7
