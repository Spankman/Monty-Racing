name: Monty on-demand research race pipeline
on:
  push:
    branches: [feature/daily-expert-cache]
    paths:
      - 'monty_single_race_research.py'
      - 'test_monty_single_race_research.py'
      - '.github/workflows/monty-race-research.yml'
  workflow_dispatch:
    inputs:
      track:
        description: 'Track name (blank means all meetings)'
        required: false
        type: string
      race:
        description: 'Race number (required if track supplied)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runner.txt
      - name: Unit tests
        run: python -m unittest -v test_monty_single_race_research.py
      - name: Fetch live fields and score frozen research model
        env:
          KROK_API_KEY: ${{ secrets.KROK_API_KEY }}
        run: |
          python - <<'PY'
          import datetime, json, os
          from zoneinfo import ZoneInfo
          from krok_adapter import fetch, normalize
          if not os.getenv('KROK_API_KEY'):
              raise SystemExit('KROK_API_KEY missing: cannot run Monty')
          day=datetime.datetime.now(ZoneInfo('Australia/Brisbane')).date().isoformat()
          snapshot,audit=normalize(fetch(day,os.environ['KROK_API_KEY']),day)
          with open('research_snapshot.json','w') as f: json.dump(snapshot,f)
          with open('research_source_audit.json','w') as f: json.dump(audit,f,indent=2)
          PY
          python research_frozen_linear_replay.py research_snapshot.json --output research_scores.csv
      - name: Optional single race extraction
        env:
          TRACK: ${{ inputs.track }}
          RACE: ${{ inputs.race }}
        run: |
          if [ -n "$TRACK" ] && [ -n "$RACE" ]; then
            python monty_single_race_research.py research_scores.csv --track "$TRACK" --race "$RACE"
          elif [ -n "$TRACK" ] || [ -n "$RACE" ]; then
            echo 'Both track and race are required' >&2
            exit 1
          fi
      - name: Publish research artifacts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monty-race-research-${{ github.run_id }}
          path: |
            research_scores.csv
            research_scores.audit.json
            research_source_audit.json
            single_race_research.json
          if-no-files-found: warn
          retention-days: 2
