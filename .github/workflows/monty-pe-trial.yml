name: Monty finite private PuntersEdge trial
run-name: PE trial ${{ github.event.head_commit.message }}
on:
  push:
    branches: [trial/puntersedge-acceptance-20261126]
    paths: [operations/trial/control.json]
permissions:
  contents: read
concurrency:
  group: monty-pe-finite-trial
  cancel-in-progress: false
jobs:
  trial:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - id: control
        run: |
          python - <<'PYTHON'
          import json,os
          c=json.load(open('operations/trial/control.json'))
          if c['mode'] not in ('plan','capture','results'):raise ValueError('Invalid mode')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('mode='+c['mode']+'\n')
          PYTHON
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runner.txt
      - uses: actions/checkout@v4
        if: steps.control.outputs.mode == 'capture'
        with:
          ref: efc51abb1595ef1eb8417e2d4e0d591f6d3c9378
          path: v7_engine
      - name: Restore unchanged original private V6 records
        if: steps.control.outputs.mode == 'capture'
        run: python operations/restore_private.py
        env:
          V6_ARCHIVE_URL: ${{ secrets.V6_ARCHIVE_URL }}
          V6_ARCHIVE_TOKEN: ${{ secrets.V6_ARCHIVE_TOKEN }}
      - name: Preregister or collect results
        if: steps.control.outputs.mode != 'capture'
        run: python operations/trial/run.py "${{ steps.control.outputs.mode }}"
        env:
          PUNTERSEDGE_API_KEY: ${{ secrets.PUNTERSEDGE_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.control.outputs.mode != 'capture'
        with:
          name: pe-trial-${{ steps.control.outputs.mode }}-${{ github.run_id }}
          path: operations_output/pe-trial/public/
          retention-days: 90
          if-no-files-found: error
      - name: Scheduled paired window 00
        if: always() && steps.control.outputs.mode == 'capture'
        run: python operations/trial/run.py capture --index 0
        env:
          PUNTERSEDGE_API_KEY: ${{ secrets.PUNTERSEDGE_API_KEY }}
          KROK_API_KEY: ${{ secrets.KROK_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.control.outputs.mode == 'capture'
        with:
          name: pe-trial-window-00-${{ github.run_id }}
          path: operations_output/pe-trial/public/window-00/
          retention-days: 90
          if-no-files-found: error
      - name: Scheduled paired window 01
        if: always() && steps.control.outputs.mode == 'capture'
        run: python operations/trial/run.py capture --index 1
        env:
          PUNTERSEDGE_API_KEY: ${{ secrets.PUNTERSEDGE_API_KEY }}
          KROK_API_KEY: ${{ secrets.KROK_API_KEY }}
      - uses: actions/upload-artifact@v4
