name: Monty V7 provisional daily full card
on:
  push:
    branches: [main]
    paths: ['.monty/v7-daily-date.txt']
  workflow_dispatch:
    inputs:
      date:
        description: Queensland race date YYYY-MM-DD
        required: false
        type: string
permissions:
  contents: read
  issues: write
jobs:
  provisional-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: grok-independent-repairs
          path: provisional-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runner.txt
      - name: Score full dated provider card with genuine provisional V7
        env:
          KROK_API_KEY: ${{ secrets.KROK_API_KEY }}
          REQUESTED_DATE: ${{ inputs.date }}
        run: |
          DATE="${REQUESTED_DATE:-$(head -n 1 .monty/v7-daily-date.txt)}"
          cp monty_daily_price_ladder.py monty_single_race_ladder.py provisional-engine/
          cp v7/run_live_daily.py v7/provisional_output.py provisional-engine/v7/
          cd provisional-engine
          cp ../.monty/verified-fixtures-"$DATE".json verified-fixtures.json
          python -m v7.run_live_daily --date "$DATE" --verified-fixtures verified-fixtures.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-daily-${{ github.run_id }}
          path: provisional-engine/output_v7_daily/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish safe provisional summary and execution status to issue 98
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          output=Path("monty_v7_status_comment.md")
          report=Path("provisional-engine/output_v7_daily/selections.md")
          header=f"### Monty V7 daily execution — {os.environ['JOB_STATUS']}\n[Workflow run]({os.environ['RUN_URL']})\n\n"
          if report.exists():
              body=report.read_text(encoding="utf-8")
              output.write_text((header+body)[:60000],encoding="utf-8")
          else:
              output.write_text(header+"No selections report generated. Inspect workflow job logs for the failure.\n",encoding="utf-8")
          PY
          gh issue comment 98 --body-file monty_v7_status_comment.md
