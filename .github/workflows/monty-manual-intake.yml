name: Monty manual Krok connection check
on:
  workflow_dispatch:
    inputs:
      date:
        description: Racing date in Queensland (YYYY-MM-DD)
        required: false
        type: string
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runner.txt
      - name: Check live provider connection without predictions
        env:
          KROK_API_KEY: ${{ secrets.KROK_API_KEY }}
          RACING_DATE: ${{ inputs.date }}
        run: |
          if [ -z "$RACING_DATE" ]; then
            RACING_DATE="$(TZ=Australia/Brisbane date +%F)"
          fi
          python check_krok.py --date "$RACING_DATE" --output connection_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monty-connection-${{ github.run_id }}
          path: connection_report.json
          if-no-files-found: error
          retention-days: 7
