name: Monty manual Krok connection check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/monty-manual-intake.yml']
  workflow_dispatch:
    inputs:
      date:
        description: Racing date in Queensland (YYYY-MM-DD)
        required: true
        type: string
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runner.txt
      - name: Check live provider connection without predictions
        env:
          KROK_API_KEY: ${{ secrets.KROK_API_KEY }}
          RACING_DATE: ${{ inputs.date || '2026-11-19' }}
        run: python check_krok.py --date "$RACING_DATE" --output connection_report.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: monty-connection-${{ github.run_id }}
          path: connection_report.json
          if-no-files-found: error
          retention-days: 7
      - name: Execute V6 live snapshot scoring (unverified, research only)
        env:
          KROK_API_KEY: ${{ secrets.KROK_API_KEY }}
        run: python krok_adapter.py --date 2026-11-19 --output-dir output_v05
      - name: Upload non-secret snapshot and scoring
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monty-v6-research-${{ github.run_id }}
          path: |
            output_v05/krok_snapshot.json
            output_v05/krok_adapter_audit.json
            output_v05/scored/monty_selections.csv
            output_v05/scored/run_audit.json
          if-no-files-found: warn
          retention-days: 7
