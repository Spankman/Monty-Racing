name: Monty manual Krok connection check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/monty-manual-intake.yml']
  workflow_dispatch:
    inputs:
      date:
        description: Racing date in Queensland (YYYY-MM-DD)
        required: true
        type: string
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runner.txt
      - name: Check live provider connection without predictions
        env:
          KROK_API_KEY: ${{ secrets.KROK_API_KEY }}
          RACING_DATE: ${{ inputs.date || '2026-11-19' }}
        run: python check_krok.py --date "$RACING_DATE" --output connection_report.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: monty-connection-${{ github.run_id }}
          path: connection_report.json
          if-no-files-found: error
          retention-days: 7
      - name: Fetch live snapshot and isolated research scoring
        env:
          KROK_API_KEY: ${{ secrets.KROK_API_KEY }}
        run: |
          python -c "import os,json; from krok_adapter import fetch,normalize; d='2026-11-19'; snapshot,audit=normalize(fetch(d,os.environ['KROK_API_KEY']),d); open('research_snapshot.json','w').write(json.dumps(snapshot)); open('research_source_audit.json','w').write(json.dumps(audit))"
          python research_frozen_linear_replay.py research_snapshot.json --output research_scores.csv
      - name: Upload isolated research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monty-isolated-research-${{ github.run_id }}
          path: |
            research_scores.csv
            research_scores.audit.json
            research_source_audit.json
          if-no-files-found: warn
          retention-days: 7
