name: Expert cache validation
on:
  pull_request:
    paths:
      - 'monty_expert_cache.py'
      - 'test_monty_expert_cache.py'
      - 'monty_single_race_research.py'
      - 'test_monty_single_race_research.py'
      - 'monty_single_race_ladder.py'
      - 'test_monty_single_race_ladder.py'
      - 'monty_poll_race_requests.py'
      - 'test_monty_poll_race_requests.py'
      - '.github/workflows/monty-poll-race-requests.yml'
      - '.github/workflows/monty-race-research.yml'
      - '.github/workflows/monty-issue-request.yml'
      - '.github/workflows/expert-cache-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate expert cache
        run: python -m unittest -v test_monty_expert_cache.py test_monty_single_race_research.py test_monty_single_race_ladder.py test_monty_poll_race_requests.py
