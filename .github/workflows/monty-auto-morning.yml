name: Monty automatic morning live run
on:
  schedule:
    # 08:10 Australia/Brisbane daily (UTC+10; no daylight saving)
    - cron: '10 22 * * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  dispatch-research:
    runs-on: ubuntu-latest
    steps:
      - name: Start repair-branch live research run for Brisbane today
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DATE=$(TZ=Australia/Brisbane date +%F)
          echo "Requesting Monty research run for Brisbane date $DATE"
          # Run both the operational-branch integration check and main research audit.
          gh workflow run monty-live-smoke.yml --ref grok-independent-repairs -f date="$DATE" -f include_restricted_flat_research=false
          gh workflow run monty-daily-research.yml --ref main
          echo "Dispatch requested; this does not certify bets or verify downstream completion."
