name: Monty timing staging
on:
  push:
    branches: [staging/monty-stage-timing]
permissions:
  contents: read
  issues: read
jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: efc51abb1595ef1eb8417e2d4e0d591f6d3c9378
          path: v7_engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runner.txt
      - name: Restore frozen artifacts
        env:
          V6_ARCHIVE_URL: ${{ secrets.V6_ARCHIVE_URL }}
          V6_ARCHIVE_TOKEN: ${{ secrets.V6_ARCHIVE_TOKEN }}
        run: python operations/restore_private.py
      - name: Compare live issue lookup and backlog discovery read-only
        env:
          GH_TOKEN: ${{ github.token }}
          KROK_API_KEY: ${{ secrets.KROK_API_KEY }}
        run: |
          python - <<'PY'
          from datetime import datetime
          import os
          import subprocess
          import sys
          from zoneinfo import ZoneInfo
          from operations.worker import work_items
          event_number = 157
          run_tag = os.environ['GITHUB_RUN_ID'] + '-staging'
          items = work_items('queue', str(event_number), datetime.now(ZoneInfo('Australia/Brisbane')), run_tag)
          number, request = next(items)
          assert number == event_number and request['meeting'].casefold() == 'ararat'
          subprocess.run([sys.executable, 'monty_operations.py', '--timings', '--command', request['command'],
                          '--country', request['country'], '--output', 'timing_output',
                          '--v7-root', 'v7_engine', '--run-id', run_tag], check=True)
          assert all(number != event_number for number, _ in items)
          PY
