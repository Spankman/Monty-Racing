name: Monty timing staging
on:
  push:
    branches: [staging/monty-stage-timing]
permissions:
  contents: read
  issues: read
jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: efc51abb1595ef1eb8417e2d4e0d591f6d3c9378
          path: v7_engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runner.txt
      - name: Restore frozen artifacts
        env:
          V6_ARCHIVE_URL: ${{ secrets.V6_ARCHIVE_URL }}
          V6_ARCHIVE_TOKEN: ${{ secrets.V6_ARCHIVE_TOKEN }}
        run: python operations/restore_private.py
      - name: Measure live queue discovery with GET-only permissions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from operations.timing import timed
          from operations.transport import requests
          with timed('queue_discovery', os.environ['GITHUB_RUN_ID'] + '-staging'):
              list(requests())
          PY
      - name: Measure provider fetch through frozen inference
        env:
          KROK_API_KEY: ${{ secrets.KROK_API_KEY }}
        run: |
          python monty_operations.py --timings --command RM6PS --country AU --output timing_output --v7-root v7_engine --run-id "${GITHUB_RUN_ID}-staging"
