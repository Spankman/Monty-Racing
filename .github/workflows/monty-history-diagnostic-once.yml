name: Requested Monty history diagnostics
on:
  push:
    branches: [repair/history-bridge]
    paths: [.github/workflows/monty-history-diagnostic-once.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check form and archive access with bounded requests
        env:
          KROK_API_KEY: ${{ secrets.KROK_API_KEY }}
        run: python diagnose_history.py
