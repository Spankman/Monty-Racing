name: Monty offline inference evidence acceptance
on:
  pull_request:
    paths:
      - 'operations/evidence/**'
      - 'operations/model_audit.py'
      - 'operations/evidence_acceptance.py'
      - 'operations/research_interface.py'
      - '.github/workflows/monty-evidence-ci.yml'
permissions:
  contents: read
jobs:
  offline-evidence:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'engineering/inference-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
        with:
          ref: efc51abb1595ef1eb8417e2d4e0d591f6d3c9378
          path: v7_engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runner.txt
      - name: Restore unchanged owner-authorised frozen originals
        run: python operations/restore_private.py
        env:
          V6_ARCHIVE_URL: ${{ secrets.V6_ARCHIVE_URL }}
          V6_ARCHIVE_TOKEN: ${{ secrets.V6_ARCHIVE_TOKEN }}
      - name: Offline contracts and synthetic acquisition observers
        run: python -m unittest test_evidence_retention test_research_interface -v
      - name: Both real frozen engines on explicitly synthetic fields, no provider keys
        run: python -m operations.evidence_acceptance operations_output/evidence-fixture v7_engine
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monty-inference-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: operations_output/evidence-fixture/evidence-sealed/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monty-offline-evidence-receipts-${{ github.run_id }}
          path: operations_output/evidence-fixture/public/
          retention-days: 7
          if-no-files-found: error
      - name: Delete ephemeral private inference files
        if: always()
        run: rm -rf operations_output/evidence-fixture/private
