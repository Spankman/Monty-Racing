name: Monty V6 readiness diagnostic (no bets)
run-name: Monty V6 ${{ inputs.date }} ${{ inputs.request_id }}
on:
  push:
    branches: [main]
    paths: ['.monty/v6-readiness-date.txt']
  workflow_dispatch:
    inputs:
      date:
        description: Queensland race date YYYY-MM-DD
        required: true
        type: string
      daily:
        description: Publish the research-only V6 daily report and pre-race receipt
        type: boolean
        default: false
      request_id:
        description: Dispatcher correlation ID
        type: string
        required: false
permissions:
  contents: write
jobs:
  v6-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen V6 runner dependencies
        run: python -m pip install -r requirements-runner.txt
      - name: Restore private frozen V6 archive (if configured)
        env:
          V6_ARCHIVE_URL: ${{ secrets.V6_ARCHIVE_URL }}
          V6_ARCHIVE_TOKEN: ${{ secrets.V6_ARCHIVE_TOKEN }}
        run: |
          python - <<'PY'
          import os, tempfile, urllib.request, urllib.parse, json, base64
          from pathlib import Path
          url=os.environ.get("V6_ARCHIVE_URL","").strip()
          if not url:
              print("No V6_ARCHIVE_URL configured: original archive unavailable.")
          else:
              parsed=urllib.parse.urlsplit(url)
              if parsed.scheme!="https" or not parsed.hostname or parsed.username or parsed.password:
                  raise SystemExit("V6 archive source must be HTTPS without embedded credentials")
              token=os.environ.get("V6_ARCHIVE_TOKEN","").strip()
              if parsed.hostname=="api.github.com" and not token:
                  raise SystemExit("Private GitHub archive requires V6_ARCHIVE_TOKEN")
              headers={"User-Agent":"Monty-V6-private-archive-restore","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
              if token: headers["Authorization"]="Bearer "+token
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self,req,fp,code,msg,headers,newurl):
                      raise ValueError("Archive download redirects are not allowed")
              opener=urllib.request.build_opener(NoRedirect)
              def fetch(uri):
                  if urllib.parse.urlsplit(uri).hostname!=parsed.hostname:
                      raise ValueError("Archive source hostname changed")
                  with opener.open(urllib.request.Request(uri,headers=headers),timeout=60) as response:
                      return response.read(100_000_001)
              with tempfile.TemporaryDirectory() as td:
                  dest=Path(td)/"v6-original.zip"
                  if parsed.hostname=="api.github.com" and "/contents/" in parsed.path:
                      # Contents API does not inline files larger than 1 MB.
                      metadata=json.loads(fetch(url))
                      sha=metadata.get("sha")
                      if not sha or metadata.get("type")!="file":
                          raise ValueError("Private archive metadata lacks file SHA")
                      prefix=parsed.path.split("/contents/",1)[0]
                      blob_url="https://api.github.com"+prefix+"/git/blobs/"+sha
                      blob=json.loads(fetch(blob_url))
                      if blob.get("encoding")!="base64" or blob.get("sha")!=sha:
                          raise ValueError("Git blob response invalid")
                      raw=base64.b64decode(blob["content"],validate=False)
                      if len(raw)>100_000_000:raise ValueError("Archive exceeds 100 MB")
                      dest.write_bytes(raw)
                  else:
                      raw=fetch(url)
                      if len(raw)>100_000_000:raise ValueError("Archive exceeds 100 MB")
                      dest.write_bytes(raw)
                  from restore_archive import restore
                  print("Restored original SHA-256 verified artifacts:",restore(dest))
          PY
      - name: Verify frozen artifacts and capture provider readiness
        env:
          PYTHONPATH: ${{ github.workspace }}/monty_v6:${{ github.workspace }}
          KROK_API_KEY: ${{ secrets.KROK_API_KEY }}
          DAILY_OUTPUT: ${{ inputs.daily }}
          RACE_DATE_INPUT: ${{ inputs.date }}
        run: |
          mkdir -p v6_readiness
          export RACE_DATE="${RACE_DATE_INPUT:-$(head -n 1 .monty/v6-readiness-date.txt)}"
          python - <<'PY'
          import datetime,json,os
          from pathlib import Path
          from monty.integrity import verify_artifacts
          root=Path("monty_v6")
          report={"date":os.environ["RACE_DATE"],"v6_unchanged":True,"predictions_generated":False,"betting_authorised":False}
          try:
              report["verified_artifacts"]=verify_artifacts(root)
              report["artifacts_ok"]=True
          except Exception as exc:
              report["artifacts_ok"]=False
              report["blocker"]="Frozen archive/artifact verification: "+type(exc).__name__+": "+str(exc)
          if report["artifacts_ok"]:
              try:
                  from intake_only import capture
                  from assess_day import assess
                  out,intake=capture(os.environ["RACE_DATE"],"v6_readiness/private_capture")
                  assessment=assess(json.loads((out/"assessment_bundle.json").read_text()))
                  report["provider_races_accepted"]=intake["adapter_audit"].get("races_accepted")
                  report["price_source_counts"]=intake["adapter_audit"].get("price_source_counts",{})
                  report["active_feature_coverage"]=intake["active_feature_coverage"]
                  report["readiness"]=assessment
              except Exception as exc:
                  report["blocker"]="Live intake/readiness: "+type(exc).__name__+": "+str(exc)
          if os.environ.get("DAILY_OUTPUT")=="true" and datetime.date.fromisoformat(report["date"]).isoformat()==report["date"]:
              from v6_daily import coverage, publish, write_json
              date=report["date"]
              root=Path("v6_readiness/daily_staging")
              fixture_file=Path(".monty")/f"verified-fixtures-{date}.json"
              fixtures=json.loads(fixture_file.read_text()) if fixture_file.exists() else None
              if report.get("readiness"):
                  try:
                      card=publish(date,out,assessment,root,commit=os.environ["GITHUB_SHA"],fixtures=fixtures)
                      root.rename(Path("v6_readiness/daily"))
                      report["predictions_generated"]=bool(card["frozen_races"])
                  except Exception as exc:
                      report["blocker"]="Daily V6 scoring/publication: "+type(exc).__name__
              if report.get("blocker"):
                  # Publish only safe failure metadata; tolerate partial output from a failed scorer.
                  root=Path("v6_readiness/daily_blocked")
                  root.mkdir()
                  card=coverage(date,fixtures,{}, {})
                  card["capture_failed_or_unavailable"]=True
                  for race in card["races"]:
                      race["reasons"]=["provider_evidence_unavailable_in_completed_run"]
                  write_json(root/"coverage.json",card)
                  (root/"report.md").write_text(f"# Monty V6 daily — {date}\n\n**NO BET**\n\nDaily output blocked. See readiness status.\n")
              report["coverage_counts"]={k:card[k] for k in ("expected","provider_races","independently_verified","counts","no_bet")}
          Path("v6_readiness/status.json").write_text(json.dumps(report,indent=2,default=str)+"\n")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as h:
              h.write("## V6 readiness diagnostic (no bets)\n\n")
              h.write("Artifacts verified: "+str(report.get("artifacts_ok",False))+"\n\n")
              h.write("Krok races accepted: "+str(report.get("provider_races_accepted","not verified"))+"\n\n")
              h.write("Live betting ready: "+str(report.get("readiness",{}).get("betting_ready",False))+"\n\n")
              if report.get("blocker"):
                  h.write("BLOCKER: "+report["blocker"]+"\n\n")
              if report.get("readiness"):
                  from collections import Counter
                  races=report["readiness"].get("races",[])
                  reasons=Counter(reason for race in races for reason in race.get("reasons",[]))
                  h.write("Races assessed: "+str(len(races))+"\n\n")
                  for reason,count in reasons.items():
                      h.write("- "+reason+": "+str(count)+"\n")
              h.write("\nFull detail: uploaded status.json.\n")
          print(json.dumps({k:v for k,v in report.items() if k not in ("verified_artifacts","active_feature_coverage","readiness")},default=str))
          if not report.get("artifacts_ok") or report.get("blocker"):
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v6-readiness-${{ github.run_id }}
          path: v6_readiness/status.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && inputs.daily
        with:
          name: v6-daily-${{ github.run_id }}
          path: |
            v6_readiness/daily/coverage.json
            v6_readiness/daily/report.md
            v6_readiness/daily/forecast.json
            v6_readiness/daily/receipt.json
            v6_readiness/daily_blocked/coverage.json
            v6_readiness/daily_blocked/report.md
          if-no-files-found: error
          retention-days: 14
      - name: Publish sanitized latest readiness status for automatic checking
        if: always() && github.ref_name == 'main' && !inputs.daily
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          GH_STATUS_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          src=Path('v6_readiness/status.json')
          report=json.loads(src.read_text()) if src.exists() else {}
          blocker=str(report.get('blocker') or ('Readiness step did not produce status.json' if not src.exists() else ''))
          # Only known diagnostic messages are published; never publish private data or API responses.
          if blocker and not (blocker.startswith('Live intake/readiness: ') or blocker.startswith('Frozen archive/artifact verification: ') or blocker.startswith('Readiness step did not')):
              blocker='Unclassified diagnostic error; see private workflow logs'
          blocker=re.sub(r'https?://\S+', '[URL REDACTED]', blocker)
          blocker=re.sub(r'(?i)(api[_-]?key|token|authorization)[=: ]+\S+', r'\1=[REDACTED]', blocker)
          safe={
            'run_id':os.environ['RUN_ID'],
            'run_url':os.environ['RUN_URL'],
            'job_status':os.environ['JOB_STATUS'],
            'date':report.get('date'),
            'artifacts_ok':report.get('artifacts_ok',False),
            'races_accepted':report.get('provider_races_accepted'),
            'price_source_counts':{k:int(v) for k,v in (report.get('price_source_counts') or {}).items() if k in ('TAB','fixed_win','best_win') and isinstance(v,int) and not isinstance(v,bool) and 0<=v<=100000},
            'betting_authorised':False,
            'predictions_generated':False,
            'blocker':blocker[:400],
          }
          # Publish aggregate diagnostics only: feature names/counts and reason totals.
          # No runner identities, raw provider records, credentials or archive contents.
          from collections import Counter
          coverage=report.get('active_feature_coverage') or {}
          safe['feature_coverage']={
            str(name): {'runners_present': int(detail.get('runners',0)),
                        'status': str(detail.get('status','unknown'))}
            for name,detail in coverage.items()
            if isinstance(name,str) and re.fullmatch(r'[a-z][a-z0-9_]{0,79}',name)
            and isinstance(detail,dict) and isinstance(detail.get('runners'),int)
            and not isinstance(detail.get('runners'),bool)
            and 0 <= detail['runners'] <= 100000
            and detail.get('status') in ('present','missing','derivable_from_accepted_field')
          }
          races=(report.get('readiness') or {}).get('races') or []
          safe['races_assessed']=len(races)
          safe['readiness_reason_counts']=dict(Counter(
            reason for race in races if isinstance(race,dict)
            for reason in race.get('reasons',[])
            if isinstance(reason,str) and re.fullmatch(r'[a-z][a-z0-9_]{0,79}',reason)
          ))
          Path('.monty/v6-latest-status.json').write_text(json.dumps(safe,indent=2)+'\n')
          PY
          python - <<'PY'
          import base64,json,os,time,urllib.request,urllib.error
          from pathlib import Path
          repository=os.environ['GITHUB_REPOSITORY']
          endpoint='https://api.github.com/repos/'+repository+'/contents/.monty/v6-latest-status.json'
          token=os.environ['GH_STATUS_TOKEN']
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json',
                   'X-GitHub-Api-Version':'2022-11-28','User-Agent':'Monty-readiness-status'}
          content=base64.b64encode(Path('.monty/v6-latest-status.json').read_bytes()).decode()
          for attempt in range(5):
              sha=None
              try:
                  req=urllib.request.Request(endpoint,headers=headers)
                  with urllib.request.urlopen(req,timeout=20) as resp:
                      sha=json.load(resp).get('sha')
              except urllib.error.HTTPError as exc:
                  if exc.code!=404:raise
              body={'message':'Record sanitized V6 readiness status [skip ci]',
                    'content':content,'branch':'main'}
              if sha:body['sha']=sha
              req=urllib.request.Request(endpoint,data=json.dumps(body).encode(),headers={
                  **headers,'Content-Type':'application/json'},method='PUT')
              try:
                  with urllib.request.urlopen(req,timeout=25) as resp:
                      print('Published sanitized V6 readiness status:',resp.status)
                  break
              except urllib.error.HTTPError as exc:
                  if exc.code not in (409,422) or attempt==4:
                      print('Status publication failed; HTTP',exc.code,
                            '(check Actions workflow write permissions)')
                      raise
                  time.sleep(1+attempt)
          PY
