name: Requested Monty tomorrow batch capture
on:
  push:
    branches: [run/monty-2026-11-18]
    paths: [.github/workflows/monty-requested-tomorrow.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.3
      - name: Fetch once and encrypt requested racing inputs
        env:
          KROK_API_KEY: ${{ secrets.KROK_API_KEY }}
        run: |
          python - <<'PYTHON'
          import base64,datetime as dt,gzip,json,os,urllib.request
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          key=os.environ['KROK_API_KEY']
          req=urllib.request.Request('https://krokodds.com.au/api/v1/racing/meetings?date=2026-11-18&race_type=T&limit=50',headers={'X-API-Key':key,'Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=35) as response: raw=response.read(20000001)
          if len(raw)>20000000:raise ValueError('Response too large')
          p=json.loads(raw)
          if p.get('success') is not True:raise ValueError('Provider response not successful')
          meetings=[]
          for m in p.get('data',[]):
           if m.get('country') not in ('AU','NZ') or m.get('type') not in ('T','R'):continue
           item={k:m.get(k) for k in ('venue','country','type','date','track_hint')}
           item['races']=[]
           for race in m.get('races',[]):
            r={k:race.get(k) for k in ('number','status','distance_m','distance','track_condition','jump_time','runner_count')}
            r['runners']=[{k:runner.get(k) for k in ('number','name','is_scratched','barrier','weight','age','claim_kg','odds','fixed_win','best_win')} for runner in race.get('runners',[])]
            item['races'].append(r)
           meetings.append(item)
          bundle={'captured_at_utc':dt.datetime.now(dt.timezone.utc).isoformat(),'payload':{'success':True,'meta':{k:v for k,v in p.get('meta',{}).items() if k in ('truncated','has_more','next_cursor','next_page','next','rate_limit')},'data':meetings}}
          plain=json.dumps(bundle).replace(key,'[REDACTED]').encode()
          public=serialization.load_pem_public_key('-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEArDECtXxFfmAaq8dDSXT/\nVseECXwZO58MEUdJJdy8k8omahRYLhP5SFO9Ytk7s2tYeV8O7mJmGg4zYqTXg02J\nENHvOCs0mldjrxNxYjEhFC6yKz14zy52T3BiQq9C1qF53eYJhq7UnlgdFGefOSfg\nAHVTdkvb3pZUDRMf6fPMimP1ftDu+qiENpdgFRAasrQcA5bGgTDoi97f/PwFlO7g\n7rciQVMW9xrKuDRfPlCh3tl8h0BUDMM8k/NFgV5lIHh+Ypv7RF/kVTkHym2WMYLK\nhV+YpDo6wq/nn/73Xo6FU/pyrE4a0O9Nsn03+I7l9yXOERyyKRzcS6fBXxn6HX4E\n8wIDAQAB\n-----END PUBLIC KEY-----\n'.encode())
          aes=os.urandom(32);nonce=os.urandom(12)
          wrapped=public.encrypt(aes,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          cipher=AESGCM(aes).encrypt(nonce,gzip.compress(plain),None)
          print('MONTY_CAPTURE='+json.dumps({k:base64.b64encode(v).decode() for k,v in {'key':wrapped,'nonce':nonce,'cipher':cipher}.items()}))
          PYTHON
