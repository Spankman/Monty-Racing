name: Requested Monty form availability probe
on:
  push:
    branches: [repair/live-readiness]
    paths: [.github/workflows/monty-form-probe-once.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runner.txt
      - name: Audit available form fields without scoring or publishing runner records
        env:
          KROK_API_KEY: ${{ secrets.KROK_API_KEY }}
        run: python probe_form.py
