name: Monty offline code checks
on:
  pull_request:
  push:
    branches: [main, monty-repair-2026-11-17, development/v7-candidate2-evidence, development/v7-candidate2-audit-followup]
permissions:
  contents: read
jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runner.txt
      - name: Adapter, provenance and restoration tests (no secrets or historical data)
        run: python -m unittest test_krok_adapter test_adapter_parity test_v06 test_backend_bridge test_discover_meetings test_v04.Integration.test_incomplete_race_rejected test_operations test_readiness test_history_bridge test_tab_inputs test_pdf_form test_formfav_inputs test_formfav_client test_betfair_metadata test_connections_enrichment test_collect_connections test_monty_v7_shadow_blend test_compare_v6_v7 test_monty_exotic_ladder test_monty_expert_pipeline test_monty_expert_weight_gate test_monty_expert_source_audit test_monty_expert_independence test_monty_expert_article_discovery test_monty_daily_expert_gate test_monty_expert_candidate_extract test_monty_expert_article_capture test_monty_expert_candidate_field_audit test_monty_poll_race_requests test_monty_prospective_ledger test_monty_settle_verified_wins test_historical_asof test_monty_single_race_ladder test_monty_daily_research_preview test_monty_daily_price_ladder test_monty_single_race_research v7.test_v7 v7.test_diagnostics v7.test_reconcile v7.test_holdout

  separate-provisional-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: efc51abb1595ef1eb8417e2d4e0d591f6d3c9378
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runner.txt
      - name: Experimental V7 value-watch tests
        run: python -m unittest v7.test_value_watch v7.test_provisional_value_contract
