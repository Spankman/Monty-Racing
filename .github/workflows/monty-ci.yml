name: Monty offline code checks
on:
  pull_request:
  push:
    branches: [main, monty-repair-2026-11-17]
permissions:
  contents: read
jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runner.txt
      - name: Adapter, provenance and restoration tests (no secrets or historical data)
        run: python -m unittest test_krok_adapter test_adapter_parity test_v06 test_backend_bridge test_discover_meetings test_v04.Integration.test_incomplete_race_rejected test_operations test_readiness test_history_bridge test_tab_inputs test_pdf_form test_formfav_inputs test_formfav_client test_betfair_metadata test_connections_enrichment test_collect_connections test_monty_v7_shadow_blend test_compare_v6_v7 test_monty_exotic_ladder test_monty_expert_pipeline
