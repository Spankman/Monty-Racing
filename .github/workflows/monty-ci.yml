name: Monty offline code checks
on:
  pull_request:
  push:
    branches: [main, monty-repair-2026-11-17, monty-operational-readiness-2026-11-19, grok-independent-repairs]
permissions:
  contents: read
jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runner.txt
      - name: Adapter, provenance and restoration tests (no secrets or historical data)
        run: python -m unittest test_check_krok test_krok_adapter test_adapter_parity test_v06 test_backend_bridge test_discover_meetings test_v04.Integration.test_incomplete_race_rejected test_operations test_readiness test_history_bridge test_tab_inputs test_pdf_form test_formfav_inputs test_formfav_client test_betfair_metadata test_connections_enrichment test_collect_connections test_monty_v7_shadow_blend test_compare_v6_v7 test_monty_exotic_ladder test_monty_expert_pipeline test_monty_expert_weight_gate test_monty_expert_source_audit test_monty_expert_independence test_monty_expert_article_discovery test_monty_daily_expert_gate test_monty_expert_candidate_extract test_monty_expert_article_capture test_monty_expert_candidate_field_audit test_research_daily_audit_identity test_research_evidence_manifest test_research_prediction_ledger test_research_evidence_verify test_research_result_reconciliation test_research_performance_gate test_research_source_feature_coverage test_monty_single_race_policy test_research_prediction_mode_record test_backup_zip_audit test_operational_v6 test_provisional_output_audit test_krok_results_staging test_run_verified_v6 test_recovered_v6_linear

      - name: Report missing frozen V6 artifacts (informational; never bypass integrity)
        run: python audit_v6_artifacts.py || test "$?" -eq 2
