name: Monty operational integration tests
on:
  pull_request:
  push:
    branches: [integration/chatgpt-operations]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runner.txt
      - run: python -m unittest test_approval_research test_independent_verification test_assessment_separation test_monty_ingress test_single_race_fallback test_simple_operations test_monty_operations test_adapter_parity test_v06 test_v6_daily test_monty_daily_price_ladder test_monty_prospective_ledger -v
