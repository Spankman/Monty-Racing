name: Monty poll pending race requests
on:
  pull_request:
    paths:
      - 'monty_poll_race_requests.py'
      - '.github/workflows/monty-poll-race-requests.yml'
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: monty-pending-race-requests
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: grok-independent-repairs
          path: v7_engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scoring dependencies (report failure through issue poller)
        continue-on-error: true
        run: python -m pip install -r requirements-runner.txt
      - name: Verify poller runtime
        run: |
          gh --version
          python -m unittest -v test_monty_poll_race_requests.py
      - name: Poll pending requests and post safe results
        env:
          GH_TOKEN: ${{ github.token }}
          KROK_API_KEY: ${{ secrets.KROK_API_KEY }}
        run: python monty_poll_race_requests.py
