name: Monty PuntersEdge cutover smoke test
on:
  push:
    branches: [ops/urgent-recovery-20261127]
    paths: ['.github/workflows/monty-pe-cutover-smoke.yml', 'puntersedge_adapter.py', 'monty_operations.py', 'operations/**']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: efc51abb1595ef1eb8417e2d4e0d591f6d3c9378
          path: v7_engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runner.txt
      - run: python operations/restore_private.py
        env:
          V6_ARCHIVE_URL: ${{ secrets.V6_ARCHIVE_URL }}
          V6_ARCHIVE_TOKEN: ${{ secrets.V6_ARCHIVE_TOKEN }}
      - name: Score both frozen models using PuntersEdge
        env:
          MONTY_PRICE_PROVIDER: PuntersEdge
          PUNTERSEDGE_API_KEY: ${{ secrets.PUNTERSEDGE_API_KEY }}
        shell: python
        run: |
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd()))
          from monty_operations import TZ, command, execute, projection, utcnow
          from operations.combined import combined_ticket

          day = utcnow().astimezone(TZ).date().isoformat()
          result = execute(day, 'cutover-smoke', 'v7_engine', run_id='pe-cutover-smoke')
          scored = {name: model.get('scored_races', 0) for name, model in result['models'].items()}
          commands = {}
          for text in ('RM6', 'RM7', 'RM6PS', 'RM7PS'):
              view = projection(result, command(text, day))
              commands[text] = {'status': view['status'],
                                'assessment_races': sum(bool(race['result'].get('ordered_selections')
                                                             or race['result'].get('roughies'))
                                                        for race in view['races'])}
          combined = combined_ticket(result)
          coverage = {k: v for k, v in result['coverage'].items() if k != 'provider_skips'}
          coverage['skip_count'] = len(result['coverage'].get('provider_skips', []))
          print(json.dumps({'provider': result.get('provider'), 'status': result['status'],
                            'snapshot_sha256': result.get('provider_snapshot_sha256'),
                            'captured_at': result.get('captured_at'), 'scored': scored,
                            'coverage': coverage, 'commands': commands,
                            'combined_assessment_races': len(combined['races'])}))
          single = execute(day, 'cutover-single', 'v7_engine', run_id='pe-cutover-single',
                           request=command('Cairns 4', day))
          single_views = {}
          for text in ('Cairns 4', 'RM6 Cairns 4', 'RM7 Cairns 4'):
              view = projection(single, command(text, day))
              single_views[text] = {'status': view['status'],
                                    'ranked_runners': sum(len(race['result'].get('ranked_runners', []))
                                                          for race in view['races'])}
          print(json.dumps({'single': single_views, 'capture': single.get('captured_at'),
                            'scored': {name: m.get('scored_races', 0) for name, m in single['models'].items()}}))
          if result.get('provider') != 'PuntersEdge' or not all(scored.get(name) for name in ('V6', 'V7')):
              raise SystemExit('Daily live scoring evidence incomplete')
          if not all(view['ranked_runners'] for view in single_views.values()):
              raise SystemExit('Single-race live scoring evidence incomplete')
