name: Expert Consensus Experiment
on:
  push:
    branches: [experiment/expert-consensus-v7]
  pull_request:
    paths:
      - 'expert_consensus_experiment/**'
      - '.github/workflows/expert-consensus-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s expert_consensus_experiment -p 'test_*.py' -v
