name: Monty bounded PuntersEdge comparison
on:
  push:
    branches: [integration/puntersedge-staging]
    paths: ['.monty/puntersedge-probe.json']
  pull_request:
    types: [opened]
    paths: ['.github/workflows/monty-puntersedge-probe.yml']
permissions:
  contents: read
jobs:
  comparison:
    if: (github.event_name == 'push' && github.ref_name == 'integration/puntersedge-staging') || (github.head_ref == 'integration/puntersedge-staging' && github.base_ref == 'audit/live-data-reliability' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          ref: efc51abb1595ef1eb8417e2d4e0d591f6d3c9378
          path: v7_engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runner.txt
      - run: python operations/restore_private.py
        env:
          V6_ARCHIVE_URL: ${{ secrets.V6_ARCHIVE_URL }}
          V6_ARCHIVE_TOKEN: ${{ secrets.V6_ARCHIVE_TOKEN }}
      - run: python operations/audit/puntersedge_probe.py
        env:
          PUNTERSEDGE_API_KEY: ${{ secrets.PUNTERSEDGE_API_KEY }}
          KROK_API_KEY: ${{ secrets.KROK_API_KEY }}
          PE_RUN_FROZEN: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monty-puntersedge-aggregate-evidence
          path: operations_output/puntersedge-probe/public/
