name: Monty daily research shadow scoring
on:
  push:
    branches: [main]
    paths:
      - '.monty/shadow-run-date.txt'
  workflow_dispatch:
    inputs:
      race_date:
        description: 'Queensland race date (YYYY-MM-DD); blank means today'
        required: false
        type: string
  schedule:
    - cron: '10 22 * * *' # 08:10 Australia/Brisbane, daily expert refresh before 08:30 review
permissions:
  contents: read
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runner dependencies
        run: python -m pip install -r requirements-runner.txt
      - name: Discover permitted public expert article leads (nonblocking)
        continue-on-error: true
        run: python monty_expert_article_discovery.py --output expert_article_leads.json --max-links 15
      - name: Capture permitted article candidates (research only, nonblocking)
        continue-on-error: true
        run: |
          if [ -f expert_article_leads.json ]; then
            python monty_expert_article_capture.py expert_article_leads.json --output expert_article_candidates.json --limit 2
          fi
      - name: Fetch Krok fields and score research-only frozen linear model
        env:
          KROK_API_KEY: ${{ secrets.KROK_API_KEY }}
          MONTY_RACE_DATE: ${{ inputs.race_date }}
          MONTY_EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import datetime, json, os
          from zoneinfo import ZoneInfo
          from krok_adapter import fetch, normalize
          if not os.environ.get('KROK_API_KEY'):
              raise RuntimeError('KROK_API_KEY missing')
          date=os.environ.get('MONTY_RACE_DATE','').strip()
          if not date and os.environ.get('MONTY_EVENT_NAME')=='push':
              from pathlib import Path
              date=Path('.monty/shadow-run-date.txt').read_text().strip()
          date=date or datetime.datetime.now(ZoneInfo('Australia/Brisbane')).date().isoformat()
          datetime.date.fromisoformat(date)
          snapshot,audit=normalize(fetch(date,os.environ['KROK_API_KEY']),date)
          with open('research_snapshot.json','w') as f:json.dump(snapshot,f)
          with open('research_source_audit.json','w') as f:json.dump(audit,f,indent=2)
          PY
          python research_frozen_linear_replay.py research_snapshot.json --output research_scores.csv
          python research_daily_audit.py research_scores.csv research_scores.audit.json research_source_audit.json --output daily_summary.json
          python monty_daily_research_preview.py research_scores.csv --output daily_ladder_research_preview.csv
          if [ -f expert_article_candidates.json ]; then
            python monty_expert_candidate_field_audit.py expert_article_candidates.json research_scores.csv --output expert_candidate_field_audit.json
          fi
          # Expert inputs are optional and must be real, source-attributed and pre-off.
          # A checked-in file is NOT trusted merely because it exists; the blender
          # verifies provenance/timing, field identities and coverage.
          if [ -f expert_tips_raw.csv ]; then
            # Raw source records must pass field, URL and pre-off checks first.
            # A file named verified is never accepted as sufficient evidence.
            if ! python expert_tip_ingest.py research_scores.csv expert_tips_raw.csv --output expert_tips_validated.csv; then
              echo 'EXPERT INGEST REJECTED: using model-only shadow scores'
              rm -f expert_tips_validated.csv
            fi
          fi
          if [ -f expert_tips_validated.csv ]; then
            # Expert validation errors must never prevent a model-only run.
            # Avoid leaving a partial expert blend or audit after rejection.
            if python monty_v7_shadow_blend.py research_scores.csv --experts expert_tips_validated.csv --output v7_shadow_candidate.csv && \
               python monty_expert_comparison.py research_scores.csv expert_tips_validated.csv --output expert_comparison_candidate.json; then
              mv v7_shadow_candidate.csv v7_shadow.csv
              mv expert_comparison_candidate.json expert_comparison_audit.json
              echo 'VERIFIED EXPERT FILE ACCEPTED: inspect expert_weight_used for actual blend'
            else
              echo 'EXPERT INPUT REJECTED: fall back to 100% Monty research model'
              rm -f v7_shadow_candidate.csv expert_comparison_candidate.json
              python monty_v7_shadow_blend.py research_scores.csv --output v7_shadow.csv
            fi
          else
            echo 'NO VERIFIED EXPERT INPUT: 0% expert, 100% model research scores'
            python monty_v7_shadow_blend.py research_scores.csv --output v7_shadow.csv
          fi
      - name: Render actual V7 shadow rankings (research only)
        if: success()
        run: python monty_v7_shadow_report.py v7_shadow.csv --output v7_shadow_report.md
      - name: Verify required daily research outputs exist and are nonempty
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required = [
              'research_scores.csv',
              'research_scores.audit.json',
              'research_source_audit.json',
              'daily_summary.json',
              'daily_ladder_research_preview.csv',
              'v7_shadow.csv',
              'v7_shadow_report.md',
          ]
          missing = [name for name in required if not Path(name).is_file() or Path(name).stat().st_size == 0]
          if missing:
              raise SystemExit('Missing or empty required daily artifacts: ' + ', '.join(missing))
          summary = json.loads(Path('daily_summary.json').read_text())
          if summary.get('approved_bets') != 0 or summary.get('status') != 'NO BET — RESEARCH ONLY':
              raise SystemExit('Daily output incorrectly claims betting approval')
          if summary.get('complete_AU_NZ_coverage_verified') is not False:
              raise SystemExit('Daily output incorrectly claims complete AU/NZ coverage')
          print('Required research artifacts present; research-only and coverage limits confirmed')
          PY
      - name: Upload safe research outputs (no raw API response or keys)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monty-shadow-${{ github.run_id }}
          path: |
            research_scores.csv
            research_scores.audit.json
            research_source_audit.json
            daily_summary.json
            daily_ladder_research_preview.csv
            v7_shadow.csv
            v7_shadow_report.md
            expert_comparison_audit.json
            expert_article_leads.json
            expert_article_candidates.json
            expert_candidate_field_audit.json
            expert_tips_validated.csv
          if-no-files-found: warn
          retention-days: 90
