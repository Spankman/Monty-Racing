name: Monty daily research shadow scoring
on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * *'
permissions:
  contents: read
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runner dependencies
        run: python -m pip install -r requirements-runner.txt
      - name: Fetch Krok fields and score research-only frozen linear model
        env:
          KROK_API_KEY: ${{ secrets.KROK_API_KEY }}
        run: |
          python - <<'PY'
          import datetime, json, os
          from zoneinfo import ZoneInfo
          from krok_adapter import fetch, normalize
          if not os.environ.get('KROK_API_KEY'):
              raise RuntimeError('KROK_API_KEY missing')
          date=datetime.datetime.now(ZoneInfo('Australia/Brisbane')).date().isoformat()
          snapshot,audit=normalize(fetch(date,os.environ['KROK_API_KEY']),date)
          with open('research_snapshot.json','w') as f:json.dump(snapshot,f)
          with open('research_source_audit.json','w') as f:json.dump(audit,f,indent=2)
          PY
          python research_frozen_linear_replay.py research_snapshot.json --output research_scores.csv
          python research_daily_audit.py research_scores.csv research_scores.audit.json research_source_audit.json --output daily_summary.json
      - name: Upload safe research outputs (no raw API response or keys)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monty-shadow-${{ github.run_id }}
          path: |
            research_scores.csv
            research_scores.audit.json
            research_source_audit.json
            daily_summary.json
          if-no-files-found: warn
          retention-days: 14
