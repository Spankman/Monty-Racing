name: Monty existing private transport capability
on:
  push:
    branches: [recovery/puntersedge-operations-20261127]
    paths: ['operations/private_transport_probe.py', '.github/workflows/monty-private-transport-probe.yml']
permissions:
  contents: read
jobs:
  capability:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python operations/private_transport_probe.py
        env:
          PRIVATE_RESULTS_TOKEN: ${{ secrets.V6_ARCHIVE_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: monty-private-transport-${{ github.run_id }}
          path: operations_output/private-transport-probe/
          retention-days: 7
