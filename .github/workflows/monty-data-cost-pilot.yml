name: Monty bounded data cost and live pilot
on:
  pull_request:
    types: [opened]
    paths: ['.github/workflows/monty-data-cost-pilot.yml']
permissions:
  contents: read
jobs:
  bounded-staging-pilot:
    if: github.head_ref == 'integration/data-cost-controls' && github.base_ref == 'audit/free-low-cost-data' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
        with:
          ref: efc51abb1595ef1eb8417e2d4e0d591f6d3c9378
          path: v7_engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runner.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: python operations/restore_private.py
        env:
          V6_ARCHIVE_URL: ${{ secrets.V6_ARCHIVE_URL }}
          V6_ARCHIVE_TOKEN: ${{ secrets.V6_ARCHIVE_TOKEN }}
      - run: python operations/audit/data_cost_pilot.py
        env:
          KROK_API_KEY: ${{ secrets.KROK_API_KEY }}
          KROK_FREE_API_KEY: ${{ secrets.KROK_FREE_API_KEY }}
          FORMFAV_API_KEY: ${{ secrets.FORMFAV_API_KEY }}
          PUNTERSEDGE_API_KEY: ${{ secrets.PUNTERSEDGE_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monty-data-cost-public-evidence
          path: |
            operations_output/data-cost/public/
            operations_output/data-cost/live-race/public/
