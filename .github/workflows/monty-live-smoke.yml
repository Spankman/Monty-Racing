name: Monty live Krok connectivity smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-runner.txt
      - name: Validate Krok connection and provider response
        env:
          KROK_API_KEY: ${{ secrets.KROK_API_KEY }}
        run: |
          python - <<'PY'
          import datetime, json, os
          from krok_adapter import fetch, normalize
          if not os.environ.get("KROK_API_KEY"):
              raise SystemExit("KROK_API_KEY repository secret missing; no live test performed")
          day=(datetime.datetime.now(datetime.timezone.utc)+datetime.timedelta(hours=10)).date().isoformat()
          payload=fetch(day,os.environ["KROK_API_KEY"])
          if not isinstance(payload,dict) or payload.get("success") is not True:
              raise SystemExit("Provider did not confirm success; no live test passed")
          print("Provider API returned success for Brisbane date",day)
          print("Meeting records received:",len(payload.get("data",[])))
          try:
              snapshot,audit=normalize(payload,day)
          except ValueError as exc:
              print("Provider response not sufficient for complete pre-race scoring:",str(exc))
              raise
          print("Accepted races:",audit["races_accepted"])
          print("Accepted runners:",audit["runners_accepted"])
          print("Skipped races:",len(audit["skipped"]))
          print("Independent field verification: NOT PROVEN")
          print("Betting authorised: NO")
          # Exercise full provisional scoring without publishing selections.
          import pathlib, subprocess, sys, tempfile
          with tempfile.TemporaryDirectory() as work:
              work=pathlib.Path(work)
              source=work/"snapshot.json"
              source.write_text(json.dumps(snapshot))
              result=subprocess.run(
                  [sys.executable,"operational/run_snapshot.py",str(source),
                   "--output-dir",str(work/"scored")],
                  capture_output=True,text=True)
              if result.returncode:
                  raise SystemExit("Live snapshot-to-scorer integration FAILED; inspect privately")
              record=json.loads((work/"scored"/"prediction_record.json").read_text())
              if record["betting_authorised"] or record["runner_count"]!=audit["runners_accepted"]:
                  raise SystemExit("Scoring audit mismatch or unsafe betting authorisation")
              print("Provisional scorer completed:",record["race_count"],"races,",record["runner_count"],"runners")
              print("Independent field verification: NOT PROVEN")
          PY
