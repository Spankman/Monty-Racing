name: Monty V7 provisional single race
on:
  workflow_dispatch:
    inputs:
      meeting:
        description: Exact meeting name (e.g. Gosford)
        required: true
        type: string
      race:
        description: Race number
        required: true
        type: string
      date:
        description: YYYY-MM-DD; blank uses Queensland today
        required: false
        type: string
      country:
        description: AU or NZ
        required: true
        default: AU
        type: choice
        options: [AU, NZ]
      allow_restricted:
        description: Explicitly include maiden or 2yo flat races
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  issues: write
jobs:
  provisional-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grok-independent-repairs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runner.txt
      - name: Run genuine provisional V7 from live Krok field
        id: v7_run
        env:
          KROK_API_KEY: ${{ secrets.KROK_API_KEY }}
          MEETING: ${{ inputs.meeting }}
          RACE: ${{ inputs.race }}
          DATE: ${{ inputs.date }}
          COUNTRY: ${{ inputs.country }}
          ALLOW_RESTRICTED: ${{ inputs.allow_restricted }}
        run: |
          args=(--meeting "$MEETING" --race "$RACE" --country "$COUNTRY" --output-dir output_v7_single)
          if [ -n "$DATE" ]; then args+=(--date "$DATE"); fi
          if [ "$ALLOW_RESTRICTED" = "true" ]; then args+=(--allow-restricted); fi
          python -m v7.run_live_single_race "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-single-race-${{ github.run_id }}
          path: output_v7_single/
          if-no-files-found: warn
          retention-days: 7

      - name: Post race result as GitHub issue
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_STATUS: ${{ steps.v7_run.outcome }}
        run: |
          python - <<'PY' > /tmp/monty-notification.md
          import json, os
          from pathlib import Path
          print("@Spankman — Monty V7 single-race run completed.\n")
          print("Run evidence:", os.environ["RUN_URL"], "\n")
          p=Path("output_v7_single/v7/provisional_selection.json")
          if not p.exists():
              matches=list(Path("output_v7_single").rglob("provisional_selection.json"))
              p=matches[0] if matches else p
          if p.exists():
              d=json.loads(p.read_text())
              print(f"### {d['meeting']} R{d['race']} — {d['date']} (PROVISIONAL)")
              print("**Not betting-authorised.**\n")
              for i, h in enumerate(d["ordered"][:4],1):
                  print(f"{i}. #{h['number']} {h['horse']} — fixed win ${h['fixed_win_odds']:.2f}, V7 {h['v7_win_probability']:.1%}")
              p=d.get("fixed_win_price_progression",{})
              print(f"\nProgression: **{p.get('type','UNKNOWN')} {'–'.join(p.get('numbers',[]))}**")
              print("\nValue verdict:",d.get("win_value_diagnostic",{}).get("betting_decision","Provisional; value not verified"))
          else:
              print("**Run failed or no valid selection produced.** Check the run logs for the error.")
          PY
          gh issue create --repo "${{ github.repository }}" --title "Monty V7 result — run #${{ github.run_number }}" --body-file /tmp/monty-notification.md --assignee Spankman
