name: Monty V7 provisional single race
on:
  workflow_dispatch:
    inputs:
      meeting:
        description: Exact meeting name, e.g. Gosford
        required: true
        type: string
      race:
        description: Race number
        required: true
        type: string
      date:
        description: Racing date YYYY-MM-DD (blank = today Queensland)
        required: false
        type: string
      country:
        description: AU or NZ
        required: true
        default: AU
        type: choice
        options: [AU, NZ]
      allow_restricted:
        description: Explicitly include maiden/2yo flat races for research
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  provisional-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runner.txt
      - name: Fetch provider and run genuine V7 provisional
        env:
          KROK_API_KEY: ${{ secrets.KROK_API_KEY }}
          MEETING: ${{ inputs.meeting }}
          RACE: ${{ inputs.race }}
          DATE: ${{ inputs.date }}
          COUNTRY: ${{ inputs.country }}
          ALLOW_RESTRICTED: ${{ inputs.allow_restricted }}
        run: |
          args=(--meeting "$MEETING" --race "$RACE" --country "$COUNTRY" --output-dir output_v7_single)
          if [ -n "$DATE" ]; then args+=(--date "$DATE"); fi
          if [ "$ALLOW_RESTRICTED" = "true" ]; then args+=(--allow-restricted); fi
          python -m v7.run_live_single_race "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-single-race-${{ github.run_id }}
          path: output_v7_single/
          if-no-files-found: warn
          retention-days: 7
