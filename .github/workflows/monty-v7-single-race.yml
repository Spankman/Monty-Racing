name: Monty V7 provisional single race
on:
  workflow_dispatch:
    inputs:
      meeting:
        description: Exact meeting name (e.g. Gosford)
        required: true
        type: string
      race:
        description: Race number
        required: true
        type: string
      date:
        description: YYYY-MM-DD; blank uses Queensland today
        required: false
        type: string
      country:
        description: AU or NZ
        required: true
        default: AU
        type: choice
        options: [AU, NZ]
      allow_restricted:
        description: Explicitly include maiden or 2yo flat races
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  issues: write
jobs:
  provisional-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: efc51abb1595ef1eb8417e2d4e0d591f6d3c9378
          path: provisional-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runner.txt
      - name: Run genuine provisional V7 from live Krok field
        id: v7_run
        env:
          KROK_API_KEY: ${{ secrets.KROK_API_KEY }}
          MEETING: ${{ inputs.meeting }}
          RACE: ${{ inputs.race }}
          DATE: ${{ inputs.date }}
          COUNTRY: ${{ inputs.country }}
          ALLOW_RESTRICTED: ${{ inputs.allow_restricted }}
        run: |
          cp monty_daily_price_ladder.py monty_single_race_ladder.py provisional-engine/
          cp v7/provisional_output.py provisional-engine/v7/
          git -C provisional-engine apply ../v7/provisional_engine.patch
          cd provisional-engine
          args=(--meeting "$MEETING" --race "$RACE" --country "$COUNTRY" --output-dir output_v7_single)
          if [ -n "$DATE" ]; then args+=(--date "$DATE"); fi
          if [ "$ALLOW_RESTRICTED" = "true" ]; then args+=(--allow-restricted); fi
          python -m v7.run_live_single_race "${args[@]}"
          python -m v7.provisional_output --output-dir output_v7_single
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-single-race-${{ github.run_id }}
          path: provisional-engine/output_v7_single/
          if-no-files-found: warn
          retention-days: 7
