name: Monty race request from GitHub issue
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  requested-race:
    if: >-
      startsWith(github.event.issue.title, 'Monty race: ') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grok-independent-repairs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runner.txt
      - name: Run genuine provisional V7 on requested race
        id: score
        continue-on-error: true
        env:
          KROK_API_KEY: ${{ secrets.KROK_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          python - <<'PY'
          import datetime,os,re,subprocess
          from zoneinfo import ZoneInfo
          match=re.fullmatch(r"Monty race: ([A-Za-z][A-Za-z .'-]{1,59}) ([1-9]|1[0-9]|20)",os.environ["ISSUE_TITLE"])
          if not match: raise SystemExit("Invalid race request title")
          date=datetime.datetime.now(ZoneInfo("Australia/Brisbane")).date().isoformat()
          subprocess.run(["python","-m","v7.run_live_single_race","--meeting",match.group(1),
                          "--race",match.group(2),"--date",date,"--country","AU",
                          "--output-dir","output_v7_single","--allow-restricted"],check=True)
          PY
      - name: Post genuine V7 provisional result on issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          SCORE_OUTCOME: ${{ steps.score.outcome }}
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path("output_v7_single/v7/provisional_selection.json")
          if os.environ["SCORE_OUTCOME"]=="success" and p.exists():
              d=json.loads(p.read_text())
              lines=[f"**{d['meeting']} R{d['race']} — genuine V7 PROVISIONAL**",
                     "**NOT BETTING AUTHORISED**",""]
              nums=[str(n) for n in d.get("fixed_win_price_progression",{}).get("numbers",[])]
              horses={str(h["number"]):h for h in d.get("ordered",[])}
              for i,n in enumerate(nums):
                  h=horses[n]
                  line=f"#{n} {h['horse']} — fixed WIN ${float(h['fixed_win_odds']):.2f}, V7 {h['v7_win_probability']:.1%}"
                  lines.append(f"**{line}**" if i==0 else line)
              value=d.get("provisional_value_candidate")
              if value:
                  edge=float(value["model_expected_win_roi"])
                  lines.append(f"\\n**VALUE WATCH (model-only, NO BET):** #{value['number']} {value['horse']} — fixed WIN ${float(value['fixed_win_odds']):.2f}, V7 {float(value['v7_win_probability']):.1%}, estimated ROI {edge:+.1%}")
                  lines.append("Uncalibrated estimate; not a verified betting edge.")
              else:
                  lines.append("\\n**VALUE BET: NONE — no positive model edge verified.**")
              lines.append(f"\nProgression: {d.get('fixed_win_price_progression',{}).get('type','UNKNOWN')} {'–'.join(nums)}")
              lines.append("\n"+d.get("win_value_diagnostic",{}).get("betting_decision","NO BET — provisional"))
              lines.append("\n**Evidence audit:** scored at "+str(d.get("scored_at_utc") or "UNKNOWN")+"; provider odds captured at "+str(d.get("provider_odds_captured_at_utc") or "UNKNOWN")+".")
              lines.append("Snapshot SHA-256: "+str(d.get("provider_snapshot_sha256") or "UNKNOWN"))
              lines.append("Pre-race odds evidence verified: **"+("YES" if d.get("pre_race_evidence_verified") is True else "NO")+"**. Do not count as verified pre-race performance.")
              lines.append("\nProvisional probabilities unvalidated; fixed win prices only.")
              body="\n".join(lines)
          else:
              body="**NO BET — V7 could not verify or score this race.** Check the linked GitHub Actions logs."
          pathlib.Path("comment.md").write_text(body)
          PY
          gh issue comment "$ISSUE" --body-file comment.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monty-v7-issue-${{ github.run_id }}
          path: output_v7_single/
          retention-days: 90
          if-no-files-found: ignore
