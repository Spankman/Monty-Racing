name: Monty ChatGPT operations (shared snapshot)
run-name: Monty operations ${{ inputs.command || github.event.issue.title || github.event.schedule }}
on:
  push:
    branches: [integration/chatgpt-operations, fix/simple-chatgpt-requests, fix/single-race-fallback, fix/prediction-approval-diagnostics, integration/verified-operations]
    paths: ['.github/workflows/monty-operations.yml', '.monty/operations-staging.json']
  workflow_dispatch:
    inputs:
      command:
        description: RM6 / RM7 / RM6PS / RM7PS / RM6 track race / RM7 track race
        default: RM6
        type: string
      date:
        description: Brisbane date (empty means today)
        type: string
      request_issue:
        description: Staging queue request issue number (optional)
        type: string
  issues:
    types: [opened]
  schedule:
    - cron: '10 22 * * *'
    - cron: '*/5 * * * *'
permissions:
  contents: write
  issues: write
jobs:
  acknowledge:
    if: >-
      github.event_name == 'issues' && github.event.issue.user.login == 'Spankman'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      route: ${{ steps.ingress.outputs.route }}
    steps:
      - uses: actions/checkout@v4
      - name: Acknowledge ChatGPT submission
        id: ingress
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 operations/ingress.py
  operate:
    needs: acknowledge
    if: >-
      always() && (github.event_name != 'issues' || needs.acknowledge.outputs.route == 'true')
    concurrency:
      group: monty-operations-queue
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check whether the issue already has a terminal result
        id: event
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          MONTY_ISSUE: ${{ github.event.issue.number }}
        run: |
          marker="<!-- monty-request:$MONTY_ISSUE:terminal -->"
          if timeout 10s gh api "repos/$GITHUB_REPOSITORY/issues/$MONTY_ISSUE/comments?per_page=100" \
              --jq '.[] | select(.user.login == "github-actions[bot]") | .body' | grep -Fx "$marker" >/dev/null; then
            echo "settled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.event.outputs.settled != 'true'
      - uses: actions/checkout@v4
        if: steps.event.outputs.settled != 'true'
        with:
          ref: efc51abb1595ef1eb8417e2d4e0d591f6d3c9378
          path: v7_engine
      - uses: actions/setup-python@v5
        if: steps.event.outputs.settled != 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-runner.txt
      - name: Install existing frozen runtime (startup failures reported by worker)
        if: steps.event.outputs.settled != 'true'
        continue-on-error: true
        run: python -m pip install -r requirements-runner.txt
      - name: Install public authority PDF reader for the isolated pilot
        if: github.ref_name == 'integration/verified-operations'
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
      - name: Restore original private artifacts without changing manifest
        if: steps.event.outputs.settled != 'true'
        continue-on-error: true
        env:
          V6_ARCHIVE_URL: ${{ secrets.V6_ARCHIVE_URL }}
          V6_ARCHIVE_TOKEN: ${{ secrets.V6_ARCHIVE_TOKEN }}
        run: python operations/restore_private.py
      - name: Process authenticated commands or shared daily card
        if: steps.event.outputs.settled != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATIONS_RESULTS_BRANCH: ${{ github.event_name == 'push' && (github.ref_name == 'fix/single-race-fallback' && 'monty-single-staging-results' || 'monty-simple-staging-results') || 'monty-operations-results' }}
          MONTY_PRIVATE_RESULTS_TOKEN: ${{ secrets.MONTY_PRIVATE_RESULTS_TOKEN }}
          MONTY_PRICE_PROVIDER: PuntersEdge
          PUNTERSEDGE_API_KEY: ${{ secrets.PUNTERSEDGE_API_KEY }}
          KROK_API_KEY: ${{ secrets.KROK_API_KEY }}
          MONTY_EVIDENCE_POLICY: ${{ vars.MONTY_EVIDENCE_POLICY }}
          OPERATIONS_COMMAND: ${{ github.event_name == 'push' && (github.ref_name == 'fix/single-race-fallback' && 'RM6 Ballina 7' || 'RMV6PS') || inputs.command }}
          OPERATIONS_ISSUE_COMMENTS: ${{ github.ref_name == github.event.repository.default_branch && '1' || '0' }}
          OPERATIONS_DATE: ${{ inputs.date }}
          OPERATIONS_ISSUE: ${{ inputs.request_issue || github.event.issue.number }}
          OPERATIONS_MODE: ${{ (github.event_name == 'issues' || inputs.request_issue || github.event.schedule == '*/5 * * * *') && 'queue' || 'daily' }}
        run: |
          if [ "$GITHUB_REF_NAME" = "integration/verified-operations" ]; then
            python operations/verification_acceptance.py
          elif [ "$GITHUB_REF_NAME" = "fix/prediction-approval-diagnostics" ]; then
            python operations/acceptance.py
          else
            python operations/worker.py
          fi
      - name: Reconcile interrupted private evidence and remove plaintext
        if: always() && steps.event.outputs.settled != 'true'
        run: python -m operations.evidence.interrupted operations_output
      - name: Derived receipt and forecast artifact (no private snapshots)
        if: always() && steps.event.outputs.settled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: monty-operations-${{ github.run_id }}-${{ github.run_attempt }}
          path: operations_output/*/public/
          if-no-files-found: warn
          retention-days: 90
      - name: Licence-approved encrypted inference evidence only
        if: always() && steps.event.outputs.settled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: monty-inference-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            operations_output/*/evidence-sealed/
            operations_output/*/evidence-checkpoints/
            operations_output/*/evidence-recovery.json
          if-no-files-found: ignore
          retention-days: 7
  report_failure:
    needs: [operate, acknowledge]
    if: always() && github.event_name == 'issues' && (needs.operate.result == 'failure' || needs.operate.result == 'cancelled' || needs.acknowledge.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Report missing result on originating issue
        env:
          GH_TOKEN: ${{ github.token }}
          MONTY_ISSUE: ${{ github.event.issue.number }}
          OPERATE_RESULT: ${{ needs.operate.result }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/issues/$MONTY_ISSUE/comments"
          marker="<!-- monty-request:$MONTY_ISSUE:terminal -->"
          body="$marker
          **Monty FAILED** · The worker ended with status $OPERATE_RESULT before it could confirm issue delivery.
          [Workflow]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          for delay in 0 1 2; do
            sleep "$delay"
            if timeout 5s gh api "$endpoint?per_page=100" --jq '.[] | select(.user.login == "github-actions[bot]") | .body' | grep -Fx "$marker" >/dev/null; then exit 0; fi
            if timeout 5s gh api "$endpoint" --method POST -f body="$body" --silent; then exit 0; fi
          done
          exit 1
